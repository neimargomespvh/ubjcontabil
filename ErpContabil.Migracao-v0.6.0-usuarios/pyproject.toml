[project]
name = "erp-contabil-migracao"
version = "0.6.0"
description = "Módulo de migração do ERP Contábil (Fortes / Tron / SPED) — production ready"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pymssql>=2.3.0",
    "firebird-driver>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: testes que exigem PostgreSQL real",
    "slow: testes demorados",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/web/app.py" = ["B008"]
"src/web/auth.py" = ["B008"]
"scripts/*.py" = ["T201", "E402"]
"tests/*.py" = ["S105", "S106"]
"tools/*.py" = ["T201", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.web.*"
disallow_untyped_decorators = false
